<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" fill="none">
  <!-- RNR ADS Emblem -->
  <g transform="translate(10, 5)">
    <!-- Outer Purple Arcs -->
    <path d="M 22 20 C 14 30 14 50 22 60" stroke="#8E44AD" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M 58 20 C 66 30 66 50 58 60" stroke="#8E44AD" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
    
    <!-- Cyan Dynamic Radiating Flares -->
    <path d="M 28 22 C 34 28 36 34 38 38" stroke="#00A9E8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 52 22 C 46 28 44 34 42 38" stroke="#00A9E8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 28 58 C 34 52 36 46 38 42" stroke="#00A9E8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 52 58 C 46 52 44 46 42 42" stroke="#00A9E8" stroke-width="3" stroke-linecap="round"/>

    <!-- Outer Yellow Ring Accent -->
    <circle cx="40" cy="40" r="14" stroke="#F1C40F" stroke-width="1.5" fill="none"/>

    <!-- Central Blue Circle -->
    <circle cx="40" cy="40" r="10" fill="#00A9E8"/>
    <!-- Center 'N' -->
    <text x="40" y="44" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">N</text>

    <!-- Four Surrounding 'R's -->
    <text x="40" y="22" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#061A33" text-anchor="middle">R</text>
    <text x="21" y="44" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#061A33" text-anchor="middle">R</text>
    <text x="59" y="44" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#061A33" text-anchor="middle">R</text>
    <text x="40" y="66" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#061A33" text-anchor="middle">R</text>

    <!-- Bottom ADS Banner -->
    <rect x="22" y="69" width="36" height="8" rx="2" fill="#8E44AD"/>
    <text x="40" y="76" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-size="6.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ADS</text>
  </g>

  <!-- Wordmark "RNR ADS" -->
  <text x="95" y="58" font-family="'Times New Roman', 'Georgia', 'Playfair Display', serif" font-size="52" font-weight="900" fill="#061A33" letter-spacing="1">RNR ADS</text>
</svg>
